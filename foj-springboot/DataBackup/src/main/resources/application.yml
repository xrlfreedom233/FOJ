nacos-url: ${NACOS_URL:127.0.0.1:8848}
nacos-username: ${NACOS_USERNAME:nacos}
nacos-password: ${NACOS_PASSWORD:nacos}
nacos-switch-config: hoj-switch.yml
nacos-web-config: hoj-web.yml

spring:
  config:
    import: ${SPRING_CONFIG_IMPORT:}
  profiles:
    active: dev
  application:
    name: hoj-data-backup
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        username: ${nacos-username}
        password: ${nacos-password}
        server-addr: ${nacos-url}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        import-check:
          enabled: false
        username: ${nacos-username}
        password: ${nacos-password}
        server-addr: ${nacos-url}
        file-extension: yml
        group: DEFAULT_GROUP
        type: yaml
        prefix: hoj
      url: http://${nacos-url}

mybatis-plus:
  mapper-locations: classpath*:top/hcode/hoj/mapper/xml/**Mapper.xml
  type-aliases-package: top.hcode.hoj.pojo.entity
  configuration:
    cache-enabled: true
  # 关闭打印 mybatis-plus 的 LOGO
  global-config:
    banner: false

# 消费者将要去访问的微服务名称（注册成功进入nacos的微服务提供者）
service-url:
  name: hoj-judge-server # 服务名

# 需要更新的语言配置(更新language表), 必须填写oj、name、isSpj来唯一定位
check-language-config:
  list:
    - oj: ME
      name: PyPy3
      isSpj: false
      description: PyPy 3.9.17 (7.3.12)
    - oj: ME
      name: PyPy
      isSpj: false
      description: PyPy 2.7.18 (7.3.9)
    - oj: ME
      name: PHP
      isSpj: false
      description: PHP 7.2.24
